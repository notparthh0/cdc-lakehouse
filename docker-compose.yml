# Postgres (source + pgvector) -> Debezium on Kafka Connect -> Kafka (KRaft).
# Names and host ports are unique so this can run next to nyc-taxi-streaming (which uses kafka:9092).
name: cdc-lakehouse

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cdc-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cdc_user
      POSTGRES_PASSWORD: cdc_pass
      POSTGRES_DB: ecommerce
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h localhost: the init-time server only listens on the socket, so this waits for the real one
      test: ["CMD-SHELL", "pg_isready -h localhost -U cdc_user -d ecommerce"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    container_name: cdc-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for Kafka Connect inside Docker, EXTERNAL for the Python sink on the host
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cdc-kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.0
    container_name: cdc-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: cdc-kafka:29092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # Save Debezium's position every 1 s, not the default 60 s. If Connect crashes before its first save, Debezium
      # re-runs the initial snapshot, and deletes made in the gap never reach the lake
      # (measured: results/experiment_faults_60s_offset_flush.json). A shorter interval also means fewer re-sends.
      OFFSET_FLUSH_INTERVAL_MS: 1000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8083/connectors"]
      interval: 3s
      retries: 60
